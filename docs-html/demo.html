                   window.STATIC_CONTENT = false

er\">Документация Diplodoc</a></p>\n<p>кусок виден всем</p>\n<h2 id=\"taby\"><a href=\"demo.html#taby\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Табы</span></a>Табы</h2>\n<h3 id=\"sejchas-tak\"><a href=\"demo.html#sejchas-tak\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Сейчас так</span></a>Сейчас так</h3>\n<h4 id=\"kak-zapustit-igru-v-web\"><a href=\"demo.html#kak-zapustit-igru-v-web\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Как запустить игру в Web</span></a>Как запустить игру в Web</h4>\n<h5 id=\"po-pryamoj-ssylke\"><a href=\"demo.html#po-pryamoj-ssylke\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">По прямой ссылке</span></a>По прямой ссылке</h5>\n<p>Прямая ссылка — это ссылка, содержащая идентификатор игры, например:</p>\n<ul>\n<li>\n<p><code>https://vk.com/app1234567</code> — для десктопной версии сайта ВКонтакте, а также для мобильного приложения ВКонтакте для Android и iOS.</p>\n</li>\n<li>\n<p><code>https://m.vk.com/app1234567</code> — для мобильной версии сайта ВКонтакте.</p>\n</li>\n</ul>\n<p>Чтобы запустить игру, откройте эту ссылку в браузере.</p>\n<p>Идентификатор игры (цифры после <code>/app</code>) вы можете найти в настройках игры:</p>\n<h4 id=\"kak-zapustit-igru-v-mobilnom-prilozhenii\"><a href=\"demo.html#kak-zapustit-igru-v-mobilnom-prilozhenii\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Как запустить игру в мобильном приложении</span></a>Как запустить игру в мобильном приложении</h4>\n<p>Пока игра не опубликована в каталоге, запустить её можно следующими способами.</p>\n<h5 id=\"iz-spiska-nedavno-zapushennyh-igr\"><a href=\"demo.html#iz-spiska-nedavno-zapushennyh-igr\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Из списка недавно запущенных игр</span></a>Из списка недавно запущенных игр</h5>\n<ol>\n<li>\n<p><a href=\"demo.html#Как%20запустить%20игру%20по%20прямой%20ссылке\">Запустите</a> игру в десктопной версии сайта ВКонтакте. После этого она попадёт в список игр, которые были запущены недавно.</p>\n</li>\n<li>\n<p>Откройте мобильное приложение ВКонтакте и запустите игру:</p>\n</li>\n</ol>\n<ul>\n<li>\n<p>Из блока <strong>Мои игры</strong> в мобильном приложении ВКонтакте для Android.</p>\n</li>\n<li>\n<p>Из блока <strong>Недавно запущенные</strong> в мобильном приложении ВКонтакте для iOS.</p>\n</li>\n</ul>\n<h5 id=\"iz-izbrannogo\"><a href=\"demo.html#iz-izbrannogo\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Из избранного</span></a>Из избранного</h5>\n<ol>\n<li>\n<p>Откройте мобильное приложение ВКонтакте и перейдите в раздел <strong>Мессенджер</strong>.</p>\n</li>\n<li>\n<p>Установите курсор в поле поиска, в разделе <strong>Важное</strong> выберите <strong>Избранное</strong> и отправьте ссылку на игру:</p>\n<p><code>https://vk.com/app1234567</code></p>\n<p>Вместо <code>1234567</code> укажите идентификатор вашей игры.</p>\n</li>\n<li>\n<p>Нажмите на ссылку в отправленном сообщении. ВКонтакте запустит игру в элементе управления WebView.</p>\n<blockquote>\n<p>При отправке сообщения мессенджер определяет, что ссылка указывает на игру, и добавляет сниппет игры к сообщению. Вы можете запустить игру, нажав на кнопку в сниппете.</p>\n</blockquote>\n</li>\n</ol>\n<h3 id=\"mozhno-tak\"><a href=\"demo.html#mozhno-tak\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Можно так</span></a>Можно так</h3>\n<h4 id=\"kak-zapustit-igru\"><a href=\"demo.html#kak-zapustit-igru\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Как запустить игру</span></a>Как запустить игру</h4>\n<div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-9y7pgq4q\" data-diplodoc-variant=\"regular\">\n<div class=\"yfm-tab-list\" role=\"tablist\">\n<div data-diplodoc-id=\"в-web\" data-diplodoc-key=\"%d0%b2%20web\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\">в Web</div>\n<div data-diplodoc-id=\"в-мобильном-приложении\" data-diplodoc-key=\"%d0%92%20%d0%bc%d0%be%d0%b1%d0%b8%d0%bb%d1%8c%d0%bd%d0%be%d0%bc%20%d0%bf%d1%80%d0%b8%d0%bb%d0%be%d0%b6%d0%b5%d0%bd%d0%b8%d0%b8\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\">В мобильном приложении</div>\n</div>\n<div id=\"tpjzr0ip\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"в Web\">\n<h5 id=\"po-pryamoj-ssylke1\"><a href=\"demo.html#po-pryamoj-ssylke1\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">По прямой ссылке</span></a>По прямой ссылке</h5>\n<p>Прямая ссылка — это ссылка, содержащая идентификатор игры, например:</p>\n<ul>\n<li>\n<p><code>https://vk.com/app1234567</code> — для десктопной версии сайта ВКонтакте, а также для мобильного приложения ВКонтакте для Android и iOS.</p>\n</li>\n<li>\n<p><code>https://m.vk.com/app1234567</code> — для мобильной версии сайта ВКонтакте.</p>\n</li>\n</ul>\n<p>Чтобы запустить игру, откройте эту ссылку в браузере.</p>\n<p>Идентификатор игры (цифры после <code>/app</code>) вы можете найти в настройках игры.</p>\n<h5 id=\"cherez-izbrannoe\"><a href=\"demo.html#cherez-izbrannoe\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Через избранное</span></a>Через избранное</h5>\n<p>Откройте игру и добавьте её в избранное. Нажмите <strong>Действия</strong> и что-то там ещё.</p>\n<p>Чтобы запустить игру, выберите её в левом меню. Также игры, добавленные в избранное, отображаются в разделе <a href=\"https://vk.com/games?act=profile\" target=\"_blank\" rel=\"noreferrer noopener\">Любимые игры</a>.</p>\n</div>\n<div id=\"9wow5giy\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"В мобильном приложении\">\n<h5 id=\"iz-spiska-nedavno-zapushennyh-igr1\"><a href=\"demo.html#iz-spiska-nedavno-zapushennyh-igr1\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Из списка недавно запущенных игр</span></a>Из списка недавно запущенных игр</h5>\n<ol>\n<li>\n<p><a href=\"demo.html#Как%20запустить%20игру%20по%20прямой%20ссылке\">Запустите</a> игру в десктопной версии сайта ВКонтакте. После этого она попадёт в список игр, которые были запущены недавно.</p>\n</li>\n<li>\n<p>Откройте мобильное приложение ВКонтакте и запустите игру:</p>\n</li>\n</ol>\n<ul>\n<li>\n<p>Из блока <strong>Мои игры</strong> в мобильном приложении ВКонтакте для Android.</p>\n</li>\n<li>\n<p>Из блока <strong>Недавно запущенные</strong> в мобильном приложении ВКонтакте для iOS.</p>\n</li>\n</ul>\n<h5 id=\"iz-izbrannogo1\"><a href=\"demo.html#iz-izbrannogo1\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Из избранного</span></a>Из избранного</h5>\n<ol>\n<li>\n<p>Откройте мобильное приложение ВКонтакте и перейдите в раздел <strong>Мессенджер</strong>.</p>\n</li>\n<li>\n<p>Установите курсор в поле поиска, в разделе <strong>Важное</strong> выберите <strong>Избранное</strong> и отправьте ссылку на игру:</p>\n</li>\n</ol>\n<p><code>https://vk.com/app1234567</code></p>\n<p>Вместо <code>1234567</code> укажите идентификатор вашей игры.</p>\n<ol>\n<li>Нажмите на ссылку в отправленном сообщении. ВКонтакте запустит игру в элементе управления WebView.</li>\n</ol>\n<blockquote>\n<p>При отправке сообщения мессенджер определяет, что ссылка указывает на игру, и добавляет сниппет игры к сообщению. Вы можете запустить игру, нажав на кнопку в сниппете.</p>\n</blockquote>\n</div>\n</div>\n<h2 id=\"krasivye-cvetnye-plashki\"><a href=\"demo.html#krasivye-cvetnye-plashki\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Красивые цветные плашки</span></a>Красивые цветные плашки</h2>\n<div class=\"yfm-note yfm-accent-info\" note-type=\"info\"><p class=\"yfm-note-title\">Примечание</p>\n<div class=\"yfm-note-content\"><p>Синие</p>\n</div></div><div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"><p class=\"yfm-note-title\">Совет</p>\n<div class=\"yfm-note-content\"><p>Зелёные</p>\n</div></div><div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"><p class=\"yfm-note-title\">Важно</p>\n<div class=\"yfm-note-content\"><p>Предупреждающие оранжевые</p>\n</div></div><div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"><p class=\"yfm-note-title\">Внимание</p>\n<div class=\"yfm-note-content\"><p>Кричащие красные</p>\n</div></div><h2 id=\"katy\"><a href=\"demo.html#katy\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Каты</span></a>Каты</h2>\n<h3 id=\"sejchas-tak1\"><a href=\"demo.html#sejchas-tak1\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Сейчас так</span></a>Сейчас так</h3>\n<h4 id=\"pravila-css\"><a href=\"demo.html#pravila-css\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Правила CSS</span></a>Правила CSS</h4>\n<p>Наш пример хранит информацию о стилях веб-элементов в CSS-файлах. Мы указываем стили в соответствии с методологией <a href=\"https://ru.bem.info/methodology/css/\" target=\"_blank\" rel=\"noreferrer noopener\">БЭМ (Блок, Элемент, Модификатор)</a>. То есть мы не указываем стили для тегов или идентификаторов, а работаем только с селекторами классов.</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs CSS\"><span class=\"hljs-comment\">/* Файл src/components/Products/Products.css */</span>\n\n<span class=\"hljs-selector-class\">.Products</span> {  \n  <span class=\"hljs-attribute\">width</span>: <span class=\"hljs-number\">100%</span>;\n  <span class=\"hljs-attribute\">height</span>
