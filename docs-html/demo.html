,-edinyj-istochnik","level":2}],"title":"Показательная страница","includes":[],"html":"<p><a href=\"https://diplodoc.com/docs/ru/index-yfm\" target=\"_blank\" rel=\"noreferrer noopener\">Документация Diplodoc</a></p>\n<h2 id=\"taby\"><a href=\"#taby\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Табы</span></a>Табы</h2>\n<h3 id=\"sejchas-tak\"><a href=\"#sejchas-tak\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Сейчас так</span></a>Сейчас так</h3>\n<h4 id=\"kak-zapustit-igru-v-web\"><a href=\"#kak-zapustit-igru-v-web\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Как запустить игру в Web</span></a>Как запустить игру в Web</h4>\n<h5 id=\"po-pryamoj-ssylke\"><a href=\"#po-pryamoj-ssylke\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">По прямой ссылке</span></a>По прямой ссылке</h5>\n<p>Прямая ссылка — это ссылка, содержащая идентификатор игры, например:</p>\n<ul>\n<li>\n<p><code>https://vk.com/app1234567</code> — для десктопной версии сайта ВКонтакте, а также для мобильного приложения ВКонтакте для Android и iOS.</p>\n</li>\n<li>\n<p><code>https://m.vk.com/app1234567</code> — для мобильной версии сайта ВКонтакте.</p>\n</li>\n</ul>\n<p>Чтобы запустить игру, откройте эту ссылку в браузере.</p>\n<p>Идентификатор игры (цифры после <code>/app</code>) вы можете найти в настройках игры:</p>\n<h4 id=\"kak-zapustit-igru-v-mobilnom-prilozhenii\"><a href=\"#kak-zapustit-igru-v-mobilnom-prilozhenii\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Как запустить игру в мобильном приложении</span></a>Как запустить игру в мобильном приложении</h4>\n<p>Пока игра не опубликована в каталоге, запустить её можно следующими способами.</p>\n<h5 id=\"iz-spiska-nedavno-zapushennyh-igr\"><a href=\"#iz-spiska-nedavno-zapushennyh-igr\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Из списка недавно запущенных игр</span></a>Из списка недавно запущенных игр</h5>\n<ol>\n<li>\n<p><a href=\"#%D0%9A%D0%B0%D0%BA%20%D0%B7%D0%B0%D0%BF%D1%83%D1%81%D1%82%D0%B8%D1%82%D1%8C%20%D0%B8%D0%B3%D1%80%D1%83%20%D0%BF%D0%BE%20%D0%BF%D1%80%D1%8F%D0%BC%D0%BE%D0%B9%20%D1%81%D1%81%D1%8B%D0%BB%D0%BA%D0%B5\">Запустите</a> игру в десктопной версии сайта ВКонтакте. После этого она попадёт в список игр, которые были запущены недавно.</p>\n</li>\n<li>\n<p>Откройте мобильное приложение ВКонтакте и запустите игру:</p>\n</li>\n</ol>\n<ul>\n<li>\n<p>Из блока <strong>Мои игры</strong> в мобильном приложении ВКонтакте для Android.</p>\n</li>\n<li>\n<p>Из блока <strong>Недавно запущенные</strong> в мобильном приложении ВКонтакте для iOS.</p>\n</li>\n</ul>\n<h5 id=\"iz-izbrannogo\"><a href=\"#iz-izbrannogo\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Из избранного</span></a>Из избранного</h5>\n<ol>\n<li>\n<p>Откройте мобильное приложение ВКонтакте и перейдите в раздел <strong>Мессенджер</strong>.</p>\n</li>\n<li>\n<p>Установите курсор в поле поиска, в разделе <strong>Важное</strong> выберите <strong>Избранное</strong> и отправьте ссылку на игру:</p>\n<p><code>https://vk.com/app1234567</code></p>\n<p>Вместо <code>1234567</code> укажите идентификатор вашей игры.</p>\n</li>\n<li>\n<p>Нажмите на ссылку в отправленном сообщении. ВКонтакте запустит игру в элементе управления WebView.</p>\n<blockquote>\n<p>При отправке сообщения мессенджер определяет, что ссылка указывает на игру, и добавляет сниппет игры к сообщению. Вы можете запустить игру, нажав на кнопку в сниппете.</p>\n</blockquote>\n</li>\n</ol>\n<h3 id=\"mozhno-tak\"><a href=\"#mozhno-tak\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Можно так</span></a>Можно так</h3>\n<h4 id=\"kak-zapustit-igru\"><a href=\"#kak-zapustit-igru\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Как запустить игру</span></a>Как запустить игру</h4>\n<div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-zjueyakh\">\n<div class=\"yfm-tab-list\" role=\"tablist\">\n<div data-diplodoc-id=\"в-web\" data-diplodoc-key=\"%d0%b2%20web\" data-diplodoc-is-active=\"true\" class=\"yfm-tab active\" role=\"tab\" aria-controls=\"emmsl26v\" aria-selected=\"true\" tabindex=\"0\">в Web</div>\n<div data-diplodoc-id=\"в-мобильном-приложении\" data-diplodoc-key=\"%d0%92%20%d0%bc%d0%be%d0%b1%d0%b8%d0%bb%d1%8c%d0%bd%d0%be%d0%bc%20%d0%bf%d1%80%d0%b8%d0%bb%d0%be%d0%b6%d0%b5%d0%bd%d0%b8%d0%b8\" data-diplodoc-is-active=\"false\" class=\"yfm-tab\" role=\"tab\" aria-controls=\"nx83q593\" aria-selected=\"false\" tabindex=\"-1\">В мобильном приложении</div>\n</div>\n<div id=\"emmsl26v\" class=\"yfm-tab-panel active\" role=\"tabpanel\" aria-labelledby=\"в-web\" data-title=\"в Web\">\n<h5 id=\"po-pryamoj-ssylke1\"><a href=\"#po-pryamoj-ssylke1\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">По прямой ссылке</span></a>По прямой ссылке</h5>\n<p>Прямая ссылка — это ссылка, содержащая идентификатор игры, например:</p>\n<ul>\n<li>\n<p><code>https://vk.com/app1234567</code> — для десктопной версии сайта ВКонтакте, а также для мобильного приложения ВКонтакте для Android и iOS.</p>\n</li>\n<li>\n<p><code>https://m.vk.com/app1234567</code> — для мобильной версии сайта ВКонтакте.</p>\n</li>\n</ul>\n<p>Чтобы запустить игру, откройте эту ссылку в браузере.</p>\n<p>Идентификатор игры (цифры после <code>/app</code>) вы можете найти в настройках игры.</p>\n<h5 id=\"cherez-izbrannoe\"><a href=\"#cherez-izbrannoe\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Через избранное</span></a>Через избранное</h5>\n<p>Откройте игру и добавьте её в избранное. Нажмите <strong>Действия</strong> и что-то там ещё.</p>\n<p>Чтобы запустить игру, выберите её в левом меню. Также игры, добавленные в избранное, отображаются в разделе <a href=\"https://vk.com/games?act=profile\" target=\"_blank\" rel=\"noreferrer noopener\">Любимые игры</a>.</p>\n</div>\n<div id=\"nx83q593\" class=\"yfm-tab-panel\" role=\"tabpanel\" aria-labelledby=\"в-мобильном-приложении\" data-title=\"В мобильном приложении\">\n<h5 id=\"iz-spiska-nedavno-zapushennyh-igr1\"><a href=\"#iz-spiska-nedavno-zapushennyh-igr1\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Из списка недавно запущенных игр</span></a>Из списка недавно запущенных игр</h5>\n<ol>\n<li>\n<p><a href=\"demo.html#Как%20запустить%20игру%20по%20прямой%20ссылке\">Запустите</a> игру в десктопной версии сайта ВКонтакте. После этого она попадёт в список игр, которые были запущены недавно.</p>\n</li>\n<li>\n<p>Откройте мобильное приложение ВКонтакте и запустите игру:</p>\n</li>\n</ol>\n<ul>\n<li>\n<p>Из блока <strong>Мои игры</strong> в мобильном приложении ВКонтакте для Android.</p>\n</li>\n<li>\n<p>Из блока <strong>Недавно запущенные</strong> в мобильном приложении ВКонтакте для iOS.</p>\n</li>\n</ul>\n<h5 id=\"iz-izbrannogo1\"><a href=\"#iz-izbrannogo1\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Из избранного</span></a>Из избранного</h5>\n<ol>\n<li>\n<p>Откройте мобильное приложение ВКонтакте и перейдите в раздел <strong>Мессенджер</strong>.</p>\n</li>\n<li>\n<p>Установите курсор в поле поиска, в разделе <strong>Важное</strong> выберите <strong>Избранное</strong> и отправьте ссылку на игру:</p>\n</li>\n</ol>\n<p><code>https://vk.com/app1234567</code></p>\n<p>Вместо <code>1234567</code> укажите идентификатор вашей игры.</p>\n<ol>\n<li>Нажмите на ссылку в отправленном сообщении. ВКонтакте запустит игру в элементе управления WebView.</li>\n</ol>\n<blockquote>\n<p>При отправке сообщения мессенджер определяет, что ссылка указывает на игру, и добавляет сниппет игры к сообщению. Вы можете запустить игру, нажав на кнопку в сниппете.</p>\n</blockquote>\n</div>\n</div>\n<h2 id=\"krasivye-cvetnye-plashki\"><a href=\"#krasivye-cvetnye-plashki\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\">Красивые цветные плашки</span></a>Красивые ц
